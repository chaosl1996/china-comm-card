<!doctype html>
<html lang="zh-CN">
<head>

<title>china-comm-card 预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; transition: background .3s; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .tip { font-size: 12px; opacity: .6; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .toolbar button { padding: 6px 16px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; cursor: pointer; font-size: 13px; }
  .toolbar button.on { background: #0b6ef3; color: #fff; border-color: #0b6ef3; }
  .toolbar select { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; font-size: 13px; }
  #stage { width: 430px; padding: 16px; border-radius: 20px; transition: background .3s; }
  body.light { background: #eef0f4; color: #1d2129; }
  body.light #stage { background: #f2f3f7; }
  body.dark { background: #0f1013; color: #e8eaf0; }
  body.dark #stage {
    background: #17181c;
    --card-background-color: #1e1f24;
    --primary-text-color: #e8eaf0;
    --secondary-text-color: #9aa0ab;
    --divider-color: rgba(255,255,255,.14);
    --error-color: #ff5a52;
    --success-color: #4cd471;
    --warning-color: #ffb74d;
    --ha-card-border-color: rgba(255,255,255,.08);
  }
</style>
</head>
<body class="light">
  <h1>china-comm-card · 中国电信 / 中国联通 套餐卡片</h1>
  <div class="tip">数据为 2026-10-23 真实快照 · 点击账号区块可弹出 more-info（在 HA 内）</div>
  <div class="toolbar">
    <button id="b-light" class="on">浅色</button>
    <button id="b-dark">深色</button>
    <span style="width:12px"></span>
    <button id="b-ring" class="on">环形图</button>
    <button id="b-bar">进度条</button>
    <span style="width:12px"></span>
    <select id="s-style" title="外观风格">
      <option value="brand" selected>品牌卡头</option>
      <option value="minimal">极简主题</option>
      <option value="accent">运营商点缀</option>
      <option value="classic">经典环形</option>
    </select>
  </div>
  <div id="stage"><china-comm-card id="card"></china-comm-card></div>

const card = document.getElementById('card');
const BASE_CONFIG = { title: '手机套餐', accounts: [{ phone: '17745135098' }, { phone: '18523885098' }] };
const cur = { style: 'brand', gauge: 'ring' };
const apply = () => card.setConfig({ ...BASE_CONFIG, style: cur.style, gauges: { style: cur.gauge, data: true, voice: true } });
apply();
card.hass = { states: STATES, themes: { darkMode: false }, locale: { language: 'zh-cn' } };

const setMode = (mode) => {
  document.body.className = mode;
  card.hass = { ...card.hass, themes: { darkMode: mode === 'dark' } };
  document.getElementById('b-light').classList.toggle('on', mode === 'light');
  document.getElementById('b-dark').classList.toggle('on', mode === 'dark');
};
const setGauge = (style) => {
  cur.gauge = style;
  apply();
  document.getElementById('b-ring').classList.toggle('on', style === 'ring');
  document.getElementById('b-bar').classList.toggle('on', style === 'bar');
};
document.getElementById('b-light').onclick = () => setMode('light');
document.getElementById('b-dark').onclick = () => setMode('dark');
document.getElementById('b-ring').onclick = () => setGauge('ring');
document.getElementById('b-bar').onclick = () => setGauge('bar');
document.getElementById('s-style').onchange = (e) => { cur.style = e.target.value; apply(); };

</body>
</html>
